name: studymate_ai
description: "StudyMate AI - Professional AI-Powered Group Study & Chat App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  http: ^1.2.2
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.3
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  socket_io_client: ^3.0.0
  fl_chart: ^0.68.0
  lucide_icons_flutter: ^3.1.15
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121214"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/


